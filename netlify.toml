# O Palavra+ é um app TanStack Start com SSR e server functions (Lovable Cloud).
# Hosts estáticos não conseguem executar esse servidor nem guardar os secrets,
# por isso Vercel/Netlify atuam como proxy para o deploy publicado do Lovable,
# que roda o SSR, as server functions e a IA com as credenciais corretas.
[build]
  command = "mkdir -p dist/vercel && printf 'proxy' > dist/vercel/.keep"
  publish = "dist/vercel"

[[redirects]]
  from = "/*"
  to = "https://palavra-arc-guia.lovable.app/:splat"
  status = 200
  force = true
